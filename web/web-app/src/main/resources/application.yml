server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lease
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-test-query: SELECT 1
      connection-timeout: 60000
      idle-timeout: 500000
      max-lifetime: 540000
      maximum-pool-size: 12
      minimum-idle: 10
      pool-name: APPHikariPool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  data:
    redis:
      host: 192.168.178.28
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      repositories:
        enabled: false
  jackson:
    time-zone: Europe/Berlin

app:
  room-detail-cache:
    enabled: false

minio:
  endpoint: http://192.168.178.28:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: lease-bucket
